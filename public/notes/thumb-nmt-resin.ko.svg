<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tnr-t tnr-d">
  <title id="tnr-t">수지가 금속처럼 움직여야 한다</title>
  <desc id="tnr-d">열팽창 막대: 알루미늄은 1도당 100만분의 23쯤, 유리섬유 강화 접합 그레이드는 20~40, 무강화 수지는 60~100. 유리 필러가 수지를 금속 쪽으로 끌어내리지 못하면 접합부가 피로로 무너진다.</desc>

  <text x="90" y="17" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">수지는 금속처럼 움직여야 한다</text>

  <rect x="28" y="34" width="25" height="10" rx="2" fill="var(--muted)"/>
  <text x="59" y="42" font-size="8" fill="var(--ink)">알루미늄</text>
  <rect x="50" y="52" width="22" height="10" rx="2" fill="var(--ok)"/>
  <text x="78" y="60" font-size="8" fill="var(--ink)">접합 그레이드</text>
  <rect x="93" y="70" width="44" height="10" rx="2" fill="var(--danger)" opacity=".8"/>
  <text x="141" y="78" font-size="8" fill="var(--ink)">무강화</text>
  <path d="M28 88 h124" stroke="var(--border)" stroke-width="1"/>
  <text x="90" y="99" font-size="7.5" text-anchor="middle" fill="var(--faint)">0 → 100 ppm/°C</text>

  <rect x="14" y="110" width="152" height="20" rx="5" fill="var(--ok)" opacity=".1"/>
  <text x="90" y="124" font-size="9" font-weight="700" text-anchor="middle" fill="var(--ok)">유리가 수지를 금속에 맞춘다</text>
</svg>
