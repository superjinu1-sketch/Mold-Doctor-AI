<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tfc-t tfc-d">
  <title id="tfc-t">The flame retardant corrodes the screw</title>
  <desc id="tfc-d">On a flame-retardant PPA, heat and moisture turn the retardant into acid that corrodes the feed screw. The black specks that show up in the parts are corrosion product, not contamination. Dry hard and purge at shutdown.</desc>

  <text x="90" y="17" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--ink)">Flame-retardant PPA</text>

  <rect x="10" y="26" width="160" height="30" rx="6" fill="var(--faint)" opacity=".1"/>
  <text x="90" y="45" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--muted)">heat + moisture → acid</text>

  <path d="M90 56 v8" fill="none" stroke="var(--faint)" stroke-width="1.2"/>

  <rect x="10" y="66" width="160" height="42" rx="6" fill="var(--danger)" opacity=".1"/>
  <rect x="10" y="66" width="160" height="42" rx="6" fill="none" stroke="var(--danger)" stroke-width="1.2"/>
  <text x="90" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="var(--danger)">the screw corrodes</text>
  <text x="90" y="101" font-size="9.5" text-anchor="middle" fill="var(--faint)">black specks, not dirt</text>

  <text x="90" y="126" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--ok)">dry hard · purge at shutdown</text>
</svg>
