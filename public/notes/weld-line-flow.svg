<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf-t wf-d">
  <title id="wf-t">Which lever moves a weld line</title>
  <desc id="wf-d">If the resin has no glass, melt temperature is the lever. If it is glass-filled and the weld does not carry load, packing pressure comes first. If it does carry load, gate position is the real answer and process settings will not reach base material properties.</desc>
  <rect x="250" y="8" width="220" height="34" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="360" y="30" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Weld line</text>
  <line x1="360" y1="42" x2="360" y2="62" stroke="var(--faint)" stroke-width="1.5"/>
  <rect x="248" y="62" width="224" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="83" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Glass-filled resin?</text>
  <line x1="248" y1="78" x2="150" y2="78" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="150" y1="78" x2="150" y2="104" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="199" y="72" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no</text>
  <rect x="18" y="104" width="215" height="64" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="125" y="123" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">Melt temperature</text>
  <text x="125" y="140" font-size="10.5" text-anchor="middle" fill="var(--faint)">chains diffuse across the joint</text>
  <text x="125" y="158" font-size="10.5" text-anchor="middle" fill="var(--faint)">the usual answer holds here</text>
  <line x1="360" y1="94" x2="360" y2="118" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="378" y="110" font-size="10.5" font-weight="600" fill="var(--faint)">yes</text>
  <rect x="228" y="118" width="264" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="139" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Does the weld carry load?</text>
  <line x1="492" y1="134" x2="580" y2="134" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="580" y1="134" x2="580" y2="160" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="536" y="128" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no</text>
  <rect x="480" y="160" width="220" height="48" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="590" y="179" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Packing pressure</text>
  <text x="590" y="195" font-size="10.5" text-anchor="middle" fill="var(--faint)">heat still cleans up the look</text>
  <line x1="360" y1="150" x2="360" y2="176" stroke="var(--ok)" stroke-width="2"/>
  <text x="378" y="167" font-size="10.5" font-weight="600" fill="var(--ok)">yes</text>
  <rect x="248" y="176" width="224" height="60" rx="6" fill="var(--ok)" opacity=".14"/>
  <text x="360" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--ok)">Gate position</text>
  <text x="360" y="213" font-size="10.5" text-anchor="middle" fill="var(--faint)">packing pressure narrows the gap</text>
  <text x="360" y="229" font-size="10.5" text-anchor="middle" fill="var(--faint)">settings alone won't close it</text>
</svg>
