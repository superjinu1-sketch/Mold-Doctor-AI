<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tsb-t tsb-d">
  <title id="tsb-t">Three checks that lead to fiber read-out</title>
  <desc id="tsb-d">Does it wipe off: no. Is the resin glass-filled: yes. Does drying meet the datasheet: yes. Then the answer is fiber read-out, and mold temperature comes first.</desc>

  <rect x="6" y="2" width="168" height="27" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="14" y="20" font-size="12.5" font-weight="600" fill="var(--ink)">Wipes off?</text>
  <rect x="134" y="7" width="34" height="17" rx="8.5" fill="var(--faint)" opacity=".16"/>
  <text x="151" y="19.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">no</text>

  <line x1="20" y1="29" x2="20" y2="35" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>

  <rect x="6" y="35" width="168" height="27" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="14" y="53" font-size="12.5" font-weight="600" fill="var(--ink)">Glass-filled?</text>
  <rect x="134" y="40" width="34" height="17" rx="8.5" fill="var(--faint)" opacity=".16"/>
  <text x="151" y="52.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">yes</text>

  <line x1="20" y1="62" x2="20" y2="68" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>

  <rect x="6" y="68" width="168" height="27" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="14" y="86" font-size="12.5" font-weight="600" fill="var(--ink)">Drying OK?</text>
  <rect x="134" y="73" width="34" height="17" rx="8.5" fill="var(--faint)" opacity=".16"/>
  <text x="151" y="85.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">yes</text>

  <line x1="20" y1="95" x2="20" y2="101" stroke="var(--ok)" stroke-width="1.4"/>

  <rect x="6" y="101" width="168" height="33" rx="7" fill="var(--ok)" opacity=".10"/>
  <rect x="6" y="101" width="168" height="33" rx="7" fill="none" stroke="var(--ok)" stroke-width="1.3"/>
  <text x="14" y="117" font-size="13" font-weight="700" fill="var(--ok)">Fiber read-out</text>
  <text x="14" y="129" font-size="9.5" fill="var(--faint)">mold temperature first</text>
</svg>
