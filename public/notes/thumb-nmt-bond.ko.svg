<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tnb-t tnb-d">
  <title id="tnb-t">접착제 없이 붙은 금속과 수지</title>
  <desc id="tnb-d">처리된 금속에 직접 사출한 수지는 접착제가 아니라 수백만 개의 나노 앵커로 붙는다. 접합은 충전 첫 몇 초에 만들어지므로 버티느냐는 프레스가 정한다.</desc>

  <text x="90" y="17" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">금속 + 수지, 접착제 없이</text>

  <rect x="14" y="28" width="152" height="30" rx="4" fill="var(--brand-tint)"/>
  <text x="90" y="47" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--brand-ink)">수지</text>
  <rect x="14" y="66" width="152" height="26" rx="4" fill="var(--muted)" opacity=".3"/>
  <text x="90" y="83" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--muted)">금속</text>
  <g fill="var(--brand)">
    <path d="M23 58 h6 l-3 10 Z"/><path d="M43 58 h6 l-3 10 Z"/><path d="M63 58 h6 l-3 10 Z"/>
    <path d="M83 58 h6 l-3 10 Z"/><path d="M103 58 h6 l-3 10 Z"/><path d="M123 58 h6 l-3 10 Z"/>
    <path d="M143 58 h6 l-3 10 Z"/>
  </g>
  <text x="90" y="104" font-size="8.5" text-anchor="middle" fill="var(--faint)">나노 앵커 · 20~50 nm</text>

  <rect x="14" y="110" width="152" height="20" rx="5" fill="var(--ok)" opacity=".1"/>
  <text x="90" y="124" font-size="9" font-weight="700" text-anchor="middle" fill="var(--ok)">버티느냐는 프레스가 정한다</text>
</svg>
