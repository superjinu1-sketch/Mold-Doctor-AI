<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tnt-t tnt-d">
  <title id="tnt-t">접합 실패는 누구 탓인가</title>
  <desc id="tnt-d">금속-수지 접합 실패는 두 갈래로 갈린다. 금속에 수지가 남았으면 프레스가 금형 온도를 올려 잡을 수 있다. 맨 금속이 드러났으면 처리된 인서트가 앞 공정에서 실패한 것이라 되돌려보내야 한다.</desc>

  <text x="90" y="17" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">파단면을 읽어라</text>

  <rect x="12" y="26" width="76" height="60" rx="5" fill="var(--ok)" opacity=".1"/>
  <rect x="12" y="26" width="76" height="60" rx="5" fill="none" stroke="var(--ok)" stroke-width="1"/>
  <text x="50" y="41" font-size="8" font-weight="700" text-anchor="middle" fill="var(--ok)">금속에 수지 남음</text>
  <rect x="24" y="48" width="52" height="9" rx="1" fill="var(--brand-tint)"/>
  <rect x="24" y="57" width="52" height="12" fill="var(--muted)" opacity=".3"/>
  <g fill="var(--brand)"><rect x="30" y="55" width="4" height="8"/><rect x="46" y="55" width="4" height="8"/><rect x="62" y="55" width="4" height="8"/></g>
  <text x="50" y="80" font-size="7.5" text-anchor="middle" fill="var(--muted)">프레스로 잡는다</text>

  <rect x="92" y="26" width="76" height="60" rx="5" fill="var(--warn)" opacity=".1"/>
  <rect x="92" y="26" width="76" height="60" rx="5" fill="none" stroke="var(--warn)" stroke-width="1"/>
  <text x="130" y="41" font-size="8" font-weight="700" text-anchor="middle" fill="var(--warn)">맨 금속</text>
  <rect x="104" y="48" width="52" height="9" rx="1" fill="var(--brand-tint)"/>
  <rect x="104" y="59" width="52" height="10" fill="var(--muted)" opacity=".3"/>
  <text x="130" y="80" font-size="7.5" text-anchor="middle" fill="var(--muted)">인서트 반품</text>

  <rect x="14" y="110" width="152" height="20" rx="5" fill="var(--ok)" opacity=".1"/>
  <text x="90" y="124" font-size="8.5" font-weight="700" text-anchor="middle" fill="var(--ok)">대개 금형 온도가 낮은 탓</text>
</svg>
