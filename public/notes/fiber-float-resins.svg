<svg viewBox="0 0 720 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ffr-t ffr-d">
  <title id="ffr-t">Crystallinity sets how hard the fiber floats</title>
  <desc id="ffr-d">Every short-glass-reinforced thermoplastic floats fiber, but not equally. Amorphous resins like PC, ABS and PC slash ABS shrink less and float less. Semi-crystalline resins like PA, PBT, PP, POM and PPS shrink more as they crystallize and float more. Higher glass loading floats more, and polypropylene floats readily because it is non-polar and needs a compatibilizer. The levers are the same for all of them; only the numbers change.</desc>

  <text x="360" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">Every glass-filled resin floats — some more than others</text>

  <!-- axis -->
  <text x="150" y="44" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ok)">floats less</text>
  <text x="570" y="44" font-size="10" font-weight="700" text-anchor="middle" fill="var(--danger)">floats more</text>
  <line x1="60" y1="52" x2="660" y2="52" stroke="var(--border)" stroke-width="1.5"/>
  <path d="M660 52 l-8 -4 l0 8 Z" fill="var(--faint)"/>

  <!-- amorphous group -->
  <rect x="60" y="64" width="290" height="86" rx="8" fill="var(--ok)" opacity=".08" stroke="var(--ok)" stroke-width="1.2"/>
  <text x="205" y="86" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ok)">Amorphous</text>
  <text x="205" y="106" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">PC · ABS · PC/ABS</text>
  <text x="205" y="126" font-size="10" text-anchor="middle" fill="var(--faint)">shrinks less → floats less</text>
  <text x="205" y="141" font-size="9.5" text-anchor="middle" fill="var(--faint)">(but gloss shows what little there is)</text>

  <!-- semi-crystalline group -->
  <rect x="370" y="64" width="290" height="86" rx="8" fill="var(--danger)" opacity=".08" stroke="var(--danger)" stroke-width="1.2"/>
  <text x="515" y="86" font-size="12" font-weight="700" text-anchor="middle" fill="var(--danger)">Semi-crystalline</text>
  <text x="515" y="106" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">PA · PBT · PP · POM · PPS</text>
  <text x="515" y="126" font-size="10" text-anchor="middle" fill="var(--faint)">crystallization shrink →</text>
  <text x="515" y="141" font-size="10" text-anchor="middle" fill="var(--faint)">pulls resin off the fiber</text>

  <!-- two more factors -->
  <rect x="60" y="164" width="290" height="34" rx="6" fill="var(--faint)" opacity=".07"/>
  <text x="205" y="185" font-size="10.5" text-anchor="middle" fill="var(--ink)">More glass (30% &gt; 15%) → floats more</text>

  <rect x="370" y="164" width="290" height="34" rx="6" fill="var(--faint)" opacity=".07"/>
  <text x="515" y="185" font-size="10.5" text-anchor="middle" fill="var(--ink)">PP: non-polar → needs compatibilizer</text>

  <text x="360" y="222" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">Same levers for all of them — mold temperature first — only the numbers change.</text>
</svg>
