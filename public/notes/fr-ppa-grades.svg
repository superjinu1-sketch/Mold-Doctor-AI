<svg viewBox="0 0 720 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fpg-t fpg-d">
  <title id="fpg-t">A hotter PPA grade breaks the same retardant down faster</title>
  <desc id="fpg-d">PPA is a family of grades that run at different temperatures. PA10T processes around 310 to 330 C, PA9T and PA6T slash 66 around 320 to 340 C, and PA6T around 330 to 340 C. The base resin does not corrode; the flame retardant does. But a hotter grade gives the same retardant more chance to break down into acid on every shot, so the hottest grades consume the screw fastest. Moisture uptake is low across all of them, roughly 0.3 to 0.5 percent against 1.5 to 2 percent for PA66, with PA9T and PA10T the lowest, but low is not the same as dry.</desc>

  <text x="360" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">Same retardant — a hotter grade breaks it down faster</text>

  <text x="130" y="44" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">Grade</text>
  <text x="335" y="44" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">Typical process temp</text>
  <text x="600" y="44" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">Moisture uptake</text>
  <text x="470" y="44" font-size="9.5" font-weight="700" text-anchor="end" fill="var(--warn)">hotter →</text>

  <line x1="200" y1="52" x2="470" y2="52" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="63" font-size="8.5" text-anchor="middle" fill="var(--faint)">305</text>
  <text x="268" y="63" font-size="8.5" text-anchor="middle" fill="var(--faint)">315</text>
  <text x="335" y="63" font-size="8.5" text-anchor="middle" fill="var(--faint)">325</text>
  <text x="402" y="63" font-size="8.5" text-anchor="middle" fill="var(--faint)">335</text>
  <text x="470" y="63" font-size="8.5" text-anchor="middle" fill="var(--faint)">345°C</text>

  <rect x="20" y="68" width="680" height="32" fill="var(--warn)" opacity=".05"/>
  <text x="36" y="82" font-size="12.5" font-weight="700" fill="var(--ink)">PA10T</text>
  <text x="36" y="95" font-size="9.5" fill="var(--faint)">310–330°C</text>
  <rect x="234" y="79" width="135" height="10" rx="2" fill="var(--warn)" opacity=".4"/>
  <text x="490" y="88" font-size="10.5" fill="var(--faint)">~0.3–0.5%  <tspan fill="var(--ok)" font-weight="700">lowest</tspan></text>

  <rect x="20" y="100" width="680" height="32" fill="var(--warn)" opacity=".09"/>
  <text x="36" y="114" font-size="12.5" font-weight="700" fill="var(--ink)">PA9T</text>
  <text x="36" y="127" font-size="9.5" fill="var(--faint)">320–340°C</text>
  <rect x="301" y="111" width="135" height="10" rx="2" fill="var(--warn)" opacity=".55"/>
  <text x="490" y="120" font-size="10.5" fill="var(--faint)">~0.3–0.5%  <tspan fill="var(--ok)" font-weight="700">lowest</tspan></text>

  <rect x="20" y="132" width="680" height="32" fill="var(--warn)" opacity=".09"/>
  <text x="36" y="146" font-size="12.5" font-weight="700" fill="var(--ink)">PA6T/66</text>
  <text x="36" y="159" font-size="9.5" fill="var(--faint)">320–340°C</text>
  <rect x="301" y="143" width="135" height="10" rx="2" fill="var(--warn)" opacity=".55"/>
  <text x="490" y="152" font-size="10.5" fill="var(--faint)">low</text>

  <rect x="20" y="164" width="680" height="32" fill="var(--warn)" opacity=".16"/>
  <text x="36" y="178" font-size="12.5" font-weight="700" fill="var(--ink)">PA6T</text>
  <text x="36" y="191" font-size="9.5" fill="var(--faint)">330–340°C</text>
  <rect x="369" y="175" width="67" height="10" rx="2" fill="var(--warn)" opacity=".75"/>
  <text x="490" y="184" font-size="10.5" fill="var(--faint)">low</text>

  <text x="360" y="212" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">The base doesn't corrode — a hotter grade just breaks the retardant down faster.</text>
</svg>
