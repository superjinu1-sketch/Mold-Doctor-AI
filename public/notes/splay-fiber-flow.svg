<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-t fl-d">
  <title id="fl-t">Order of checks for a white mark on a molded part</title>
  <desc id="fl-d">First check whether the mark wipes off. If it does, it is a surface deposit. If not, check whether the resin is glass-filled, then whether drying meets the datasheet. Only then is fiber read-out the answer.</desc>
  <rect x="250" y="8" width="220" height="34" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="360" y="30" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">White mark on the part</text>
  <line x1="360" y1="42" x2="360" y2="62" stroke="var(--faint)" stroke-width="1.5"/>
  <rect x="255" y="62" width="210" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="83" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Does it wipe off?</text>
  <line x1="255" y1="78" x2="150" y2="78" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="150" y1="78" x2="150" y2="104" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="200" y="72" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">yes</text>
  <rect x="18" y="104" width="215" height="64" rx="6" fill="var(--warn)" opacity=".13"/>
  <text x="125" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="var(--warn)">Surface deposit</text>
  <text x="125" y="139" font-size="10.5" text-anchor="middle" fill="var(--faint)">plate-out · vent gas · release agent</text>
  <text x="125" y="160" font-size="10.5" text-anchor="middle" fill="var(--faint)">process settings won't fix it</text>
  <line x1="360" y1="94" x2="360" y2="118" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="378" y="110" font-size="10.5" font-weight="600" fill="var(--faint)">no</text>
  <rect x="248" y="118" width="224" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="139" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Glass-filled resin?</text>
  <line x1="472" y1="134" x2="580" y2="134" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="580" y1="134" x2="580" y2="160" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="526" y="128" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no</text>
  <rect x="480" y="160" width="220" height="40" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="590" y="177" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Read-out is off the table</text>
  <text x="590" y="192" font-size="10.5" text-anchor="middle" fill="var(--faint)">stay on the splay branch</text>
  <line x1="360" y1="150" x2="360" y2="174" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="378" y="166" font-size="10.5" font-weight="600" fill="var(--faint)">yes</text>
  <rect x="228" y="174" width="264" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="195" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Drying meets the datasheet?</text>
  <line x1="228" y1="190" x2="120" y2="190" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="120" y2="216" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="172" y="184" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no</text>
  <rect x="20" y="216" width="200" height="40" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="120" y="233" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Moisture splay</text>
  <text x="120" y="248" font-size="10.5" text-anchor="middle" fill="var(--faint)">fix drying first</text>
  <line x1="360" y1="206" x2="360" y2="232" stroke="var(--ok)" stroke-width="2"/>
  <text x="378" y="223" font-size="10.5" font-weight="600" fill="var(--ok)">yes</text>
  <rect x="248" y="232" width="224" height="48" rx="6" fill="var(--ok)" opacity=".14"/>
  <text x="360" y="251" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--ok)">Fiber read-out</text>
  <text x="360" y="268" font-size="10.5" text-anchor="middle" fill="var(--faint)">mold temperature first</text>
</svg>
