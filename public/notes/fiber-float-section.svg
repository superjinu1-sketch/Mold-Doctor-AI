<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ffs-t ffs-d">
  <title id="ffs-t">Cold wall lets the fiber break the surface; a hot wall buries it</title>
  <desc id="ffs-d">Two cross-sections through the part surface. Against a cold mold wall the skin freezes thin, and glass fibers carried to the surface stick out through it, which reads as white haze. Against a hot mold wall the skin stays molten longer, so a resin-rich layer forms over the fibers and they stay buried below a smooth surface.</desc>

  <text x="360" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">Where the fiber ends up: cold wall vs hot wall</text>

  <!-- ============ LEFT: COLD ============ -->
  <text x="192" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="var(--danger)">COLD WALL — fiber breaks through</text>

  <!-- mold wall -->
  <rect x="34" y="48" width="316" height="12" rx="2" fill="var(--brand)" opacity=".45"/>
  <text x="44" y="57" font-size="8.5" font-weight="600" fill="var(--surface)">mold</text>
  <!-- part body -->
  <rect x="34" y="60" width="316" height="192" fill="var(--faint)" opacity=".06"/>
  <!-- thin skin band -->
  <line x1="34" y1="76" x2="350" y2="76" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="346" y="72" font-size="8.5" text-anchor="end" fill="var(--faint)">thin skin</text>

  <!-- core fibers (horizontal-ish, buried) -->
  <g stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round">
    <line x1="60" y1="108" x2="112" y2="112"/>
    <line x1="150" y1="100" x2="206" y2="104"/>
    <line x1="248" y1="114" x2="308" y2="110"/>
    <line x1="70" y1="150" x2="128" y2="146"/>
    <line x1="168" y1="158" x2="232" y2="154"/>
    <line x1="256" y1="150" x2="316" y2="156"/>
    <line x1="86" y1="196" x2="150" y2="200"/>
    <line x1="180" y1="206" x2="244" y2="202"/>
    <line x1="90" y1="234" x2="152" y2="230"/>
    <line x1="212" y1="238" x2="276" y2="234"/>
  </g>
  <!-- fibers rising to and breaking the surface -->
  <g stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round">
    <line x1="98" y1="92" x2="90" y2="61"/>
    <line x1="174" y1="90" x2="182" y2="61"/>
    <line x1="258" y1="94" x2="250" y2="61"/>
  </g>
  <!-- exposed fiber ends at the surface -->
  <g fill="var(--danger)">
    <circle cx="90" cy="60" r="2.8"/>
    <circle cx="182" cy="60" r="2.8"/>
    <circle cx="250" cy="60" r="2.8"/>
  </g>
  <text x="192" y="278" font-size="9.5" text-anchor="middle" fill="var(--danger)">white haze — fiber ends at the surface</text>

  <!-- ============ RIGHT: HOT ============ -->
  <text x="528" y="42" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ok)">HOT WALL — resin covers it</text>

  <!-- mold wall -->
  <rect x="370" y="48" width="316" height="12" rx="2" fill="var(--warn)" opacity=".5"/>
  <text x="380" y="57" font-size="8.5" font-weight="600" fill="var(--surface)">mold</text>
  <!-- part body -->
  <rect x="370" y="60" width="316" height="192" fill="var(--faint)" opacity=".06"/>
  <!-- thick resin-rich skin -->
  <rect x="370" y="60" width="316" height="30" fill="var(--brand-tint)"/>
  <line x1="370" y1="90" x2="686" y2="90" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="682" y="80" font-size="8.5" text-anchor="end" fill="var(--brand-ink)">resin-rich skin</text>

  <!-- core fibers, all below the skin -->
  <g stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round">
    <line x1="396" y1="112" x2="452" y2="116"/>
    <line x1="488" y1="106" x2="546" y2="110"/>
    <line x1="586" y1="118" x2="646" y2="114"/>
    <line x1="408" y1="152" x2="470" y2="148"/>
    <line x1="504" y1="160" x2="568" y2="156"/>
    <line x1="596" y1="152" x2="656" y2="158"/>
    <line x1="420" y1="198" x2="484" y2="202"/>
    <line x1="516" y1="208" x2="580" y2="204"/>
    <line x1="424" y1="236" x2="486" y2="232"/>
    <line x1="548" y1="238" x2="612" y2="234"/>
  </g>
  <!-- smooth surface -->
  <line x1="370" y1="60" x2="686" y2="60" stroke="var(--ok)" stroke-width="2.5"/>
  <text x="528" y="278" font-size="9.5" text-anchor="middle" fill="var(--ok)">smooth — resin over the fiber</text>

  <text x="360" y="296" font-size="0" fill="none">.</text>
</svg>
