<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gfw-t gfw-d">
  <title id="gfw-t">Why a glass-filled part warps with the flow, not the cooling</title>
  <desc id="gfw-d">A slice through the wall shows glass fibers lined up with the flow direction in the skin and scattered across the flow in the core. Because the part shrinks less along the fibers than across them, the whole part cannot stay flat and bows along the flow direction rather than along the cooling layout.</desc>

  <!-- ================= LEFT: fibers line up with the flow ================= -->
  <text x="20" y="22" font-size="13" font-weight="700" fill="var(--ink)">Fibers line up with the flow</text>
  <text x="20" y="40" font-size="11" fill="var(--faint)">a slice through the wall</text>

  <!-- flow arrow -->
  <line x1="24" y1="58" x2="120" y2="58" stroke="var(--brand-ink)" stroke-width="1.5"/>
  <path d="M120 58 l-8 -4 v8 z" fill="var(--brand-ink)"/>
  <text x="128" y="62" font-size="10" font-weight="700" fill="var(--brand-ink)">FLOW</text>

  <!-- wall slab, three bands -->
  <rect x="20" y="76" width="300" height="96" fill="var(--faint)" opacity=".06"/>
  <line x1="20" y1="100" x2="320" y2="100" stroke="var(--faint)" stroke-width="1" opacity=".5"/>
  <line x1="20" y1="148" x2="320" y2="148" stroke="var(--faint)" stroke-width="1" opacity=".5"/>

  <!-- band labels -->
  <text x="326" y="91" font-size="9" font-weight="600" fill="var(--ink)" opacity=".85">skin</text>
  <text x="326" y="127" font-size="9" fill="var(--faint)">core</text>
  <text x="326" y="164" font-size="9" font-weight="600" fill="var(--ink)" opacity=".85">skin</text>

  <!-- skin fibers: aligned with flow (horizontal) -->
  <g stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" opacity=".82">
    <line x1="34" y1="88" x2="62" y2="88"/><line x1="78" y1="88" x2="106" y2="88"/><line x1="122" y1="88" x2="150" y2="88"/><line x1="166" y1="88" x2="194" y2="88"/><line x1="210" y1="88" x2="238" y2="88"/><line x1="254" y1="88" x2="282" y2="88"/><line x1="292" y1="88" x2="314" y2="88"/>
    <line x1="34" y1="160" x2="62" y2="160"/><line x1="78" y1="160" x2="106" y2="160"/><line x1="122" y1="160" x2="150" y2="160"/><line x1="166" y1="160" x2="194" y2="160"/><line x1="210" y1="160" x2="238" y2="160"/><line x1="254" y1="160" x2="282" y2="160"/><line x1="292" y1="160" x2="314" y2="160"/>
  </g>
  <!-- core fibers: transverse / scattered (steep, alternating) -->
  <g stroke="var(--faint)" stroke-width="2.4" stroke-linecap="round" opacity=".78">
    <line x1="44" y1="108" x2="50" y2="140"/><line x1="76" y1="140" x2="84" y2="109"/><line x1="108" y1="110" x2="112" y2="141"/><line x1="140" y1="141" x2="150" y2="111"/><line x1="176" y1="109" x2="180" y2="140"/><line x1="208" y1="140" x2="217" y2="110"/><line x1="244" y1="110" x2="248" y2="141"/><line x1="278" y1="141" x2="287" y2="110"/>
  </g>

  <text x="20" y="200" font-size="11" font-weight="600" fill="var(--ink)">aligned in the skin, scattered in the core</text>

  <!-- ================= divider ================= -->
  <line x1="362" y1="30" x2="362" y2="222" stroke="var(--faint)" stroke-width="1" opacity=".3"/>

  <!-- ================= RIGHT: so the part can't stay flat ================= -->
  <text x="400" y="22" font-size="13" font-weight="700" fill="var(--ink)">So the part can't stay flat</text>
  <text x="400" y="40" font-size="11" fill="var(--faint)">less shrink along the fibers, more across</text>

  <!-- flat reference -->
  <line x1="400" y1="142" x2="700" y2="142" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="606" y="136" font-size="10" fill="var(--faint)">flat as designed</text>

  <!-- bowed part (whole part, edge on) -->
  <path d="M400 142 Q550 86 700 142" fill="none" stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- lift markers -->
  <line x1="475" y1="142" x2="475" y2="114" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
  <line x1="625" y1="142" x2="625" y2="114" stroke="var(--danger)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>

  <!-- flow direction beneath: warp axis follows flow -->
  <line x1="418" y1="164" x2="682" y2="164" stroke="var(--brand-ink)" stroke-width="1.4"/>
  <path d="M682 164 l-8 -4 v8 z" fill="var(--brand-ink)"/>
  <text x="430" y="178" font-size="9" font-weight="700" fill="var(--brand-ink)">FLOW DIRECTION</text>

  <text x="400" y="200" font-size="12" font-weight="600" fill="var(--danger)">→ the lift follows the flow</text>
  <text x="400" y="218" font-size="11" fill="var(--faint)">not the cooling layout</text>
</svg>
