<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tnf-t tnf-d">
  <title id="tnf-t">Antenna lines in a metal frame</title>
  <desc id="tnf-d">A metal phone frame with thin resin lines molded through it near the corners. The lines let radio out, keep water out, and return the frame to one structural piece.</desc>

  <text x="90" y="17" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">Metal frame, plastic lines</text>

  <!-- frame top view -->
  <rect x="60" y="26" width="60" height="70" rx="10" fill="var(--muted)" opacity=".3"/>
  <rect x="70" y="36" width="40" height="50" rx="6" fill="var(--surface)"/>
  <g fill="var(--brand)">
    <rect x="72" y="26" width="5" height="10"/>
    <rect x="103" y="26" width="5" height="10"/>
    <rect x="72" y="86" width="5" height="10"/>
    <rect x="103" y="86" width="5" height="10"/>
    <rect x="60" y="53" width="10" height="5"/>
    <rect x="110" y="53" width="10" height="5"/>
  </g>
  <text x="90" y="106" font-size="8.5" text-anchor="middle" fill="var(--faint)">radio windows · waterproof seals</text>

  <rect x="14" y="110" width="152" height="20" rx="5" fill="var(--ok)" opacity=".1"/>
  <text x="90" y="124" font-size="9" font-weight="700" text-anchor="middle" fill="var(--ok)">let radio out, keep water out</text>
</svg>
