<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frp-t frp-d">
  <title id="frp-t">Both flame retardants make acid, but only one boils off</title>
  <desc id="frp-d">A brominated flame retardant with an antimony synergist releases hydrogen bromide on heating, which becomes acid but is partly volatile and boils off as gas. Halogen-free phosphorus retardants, metal phosphinate or red phosphorus, become phosphoric acid, with phosphine also given off by red phosphorus, on heat and moisture. At PPA melt temperatures of 320 to 345 C that acid is non-volatile, so it stays and concentrates on the screw.</desc>

  <line x1="360" y1="30" x2="360" y2="206" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 4"/>

  <text x="180" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="var(--warn)">Halogenated</text>
  <text x="540" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="var(--danger)">Halogen-free (phosphorus)</text>

  <rect x="28" y="32" width="304" height="30" rx="6" fill="none" stroke="var(--warn)" stroke-width="1.4"/>
  <text x="180" y="51" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Brominated FR + Sb₂O₃</text>
  <rect x="388" y="32" width="304" height="30" rx="6" fill="none" stroke="var(--danger)" stroke-width="1.4"/>
  <text x="540" y="51" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Metal phosphinate / red P</text>

  <line x1="180" y1="62" x2="180" y2="84" stroke="var(--faint)" stroke-width="1.4"/>
  <rect x="164" y="69" width="32" height="12" fill="var(--surface)"/>
  <text x="180" y="78" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">heat</text>
  <line x1="540" y1="62" x2="540" y2="84" stroke="var(--faint)" stroke-width="1.4"/>
  <rect x="490" y="69" width="100" height="12" fill="var(--surface)"/>
  <text x="540" y="78" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">heat + moisture</text>

  <rect x="28" y="84" width="304" height="30" rx="6" fill="var(--warn)" opacity=".12"/>
  <text x="180" y="103" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--warn)">HBr (hydrogen bromide)</text>
  <rect x="388" y="84" width="304" height="30" rx="6" fill="var(--danger)" opacity=".12"/>
  <text x="540" y="103" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--danger)">Phosphoric acid · PH₃</text>

  <line x1="180" y1="114" x2="180" y2="140" stroke="var(--faint)" stroke-width="1.4"/>
  <rect x="137" y="123" width="86" height="12" fill="var(--surface)"/>
  <text x="180" y="132" font-size="10" font-weight="600" text-anchor="middle" fill="var(--faint)">+ water → acid</text>
  <line x1="540" y1="114" x2="540" y2="140" stroke="var(--faint)" stroke-width="1.4"/>

  <rect x="28" y="140" width="304" height="58" rx="6" fill="var(--warn)" opacity=".12"/>
  <text x="180" y="164" font-size="12" font-weight="700" text-anchor="middle" fill="var(--warn)">Partly volatile</text>
  <text x="180" y="183" font-size="10.5" text-anchor="middle" fill="var(--faint)">some boils off as gas</text>
  <rect x="388" y="140" width="304" height="58" rx="6" fill="var(--danger)" opacity=".14"/>
  <text x="540" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="var(--danger)">Non-volatile at 320–345°C</text>
  <text x="540" y="178" font-size="10.5" text-anchor="middle" fill="var(--faint)">stays &amp; concentrates</text>
  <text x="540" y="191" font-size="10.5" text-anchor="middle" fill="var(--faint)">on the screw</text>

  <text x="360" y="230" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Both make acid. The halogen acid partly escapes as gas — the phosphorus acid stays on the steel.</text>
</svg>
