<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nmfr-t nmfr-d">
  <title id="nmfr-t">Anatomy of an antenna line</title>
  <desc id="nmfr-d">Top view of a metal phone frame showing thin resin lines crossing the frame near the corners, where the antennas sit. Cross-section of one line: two metal walls with resin filling the cut between them. There is no gasket or adhesive; the metal-resin interface itself is the waterproof seal, and the filled line returns the frame to one structural piece.</desc>

  <text x="360" y="22" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">The antenna line: structure and seal in the same cut</text>

  <!-- LEFT: top view -->
  <rect x="40" y="38" width="310" height="196" rx="8" fill="var(--brand)" opacity=".05"/>
  <rect x="40" y="38" width="310" height="196" rx="8" fill="none" stroke="var(--brand)" stroke-width="1.2"/>
  <text x="195" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="var(--brand-ink)">top view — where the lines sit</text>

  <!-- frame band: outer ring minus inner window -->
  <rect x="125" y="74" width="140" height="122" rx="16" fill="var(--muted)" opacity=".28"/>
  <rect x="139" y="88" width="112" height="94" rx="10" fill="var(--surface)"/>
  <!-- resin lines crossing the band -->
  <g fill="var(--brand)">
    <rect x="150" y="74" width="7" height="14"/>
    <rect x="233" y="74" width="7" height="14"/>
    <rect x="150" y="182" width="7" height="14"/>
    <rect x="233" y="182" width="7" height="14"/>
    <rect x="125" y="112" width="14" height="7"/>
    <rect x="251" y="112" width="14" height="7"/>
  </g>
  <text x="195" y="216" font-size="9" text-anchor="middle" fill="var(--faint)">the lines sit where the antennas sit — near the corners</text>

  <!-- RIGHT: cross-section -->
  <rect x="370" y="38" width="310" height="196" rx="8" fill="var(--ok)" opacity=".05"/>
  <rect x="370" y="38" width="310" height="196" rx="8" fill="none" stroke="var(--ok)" stroke-width="1.2"/>
  <text x="525" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ok)">cross-section of one line</text>

  <text x="525" y="80" font-size="8.5" text-anchor="middle" fill="var(--faint)">outside — water under pressure</text>
  <!-- water arrows stopped at the surface -->
  <g stroke="var(--faint)" stroke-width="1.2">
    <path d="M505 86 v10"/><path d="M525 86 v10"/><path d="M545 86 v10"/>
  </g>
  <g fill="var(--faint)">
    <path d="M505 101 l-3.5 -5 h7 Z"/><path d="M525 101 l-3.5 -5 h7 Z"/><path d="M545 101 l-3.5 -5 h7 Z"/>
  </g>
  <!-- metal walls and resin fill -->
  <rect x="395" y="104" width="105" height="72" fill="var(--muted)" opacity=".28"/>
  <rect x="550" y="104" width="105" height="72" fill="var(--muted)" opacity=".28"/>
  <rect x="500" y="104" width="50" height="72" fill="var(--brand-tint)"/>
  <path d="M500 104 v72" stroke="var(--brand)" stroke-width="2.5"/>
  <path d="M550 104 v72" stroke="var(--brand)" stroke-width="2.5"/>
  <text x="447" y="143" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--ink)">metal</text>
  <text x="525" y="143" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--brand-ink)">resin</text>
  <text x="602" y="143" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--ink)">metal</text>
  <text x="525" y="192" font-size="8.5" text-anchor="middle" fill="var(--faint)">inside — electronics</text>
  <text x="525" y="216" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ok)">no gasket, no adhesive — the interface is the seal</text>

  <text x="360" y="262" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">One cut, three jobs: let radio out, keep water out, stay one structural piece.</text>
  <text x="360" y="280" font-size="9.5" text-anchor="middle" fill="var(--faint)">The seal is molded, not assembled — it exists only if the press makes it.</text>
</svg>
