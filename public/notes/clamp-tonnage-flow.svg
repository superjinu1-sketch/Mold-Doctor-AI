<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cf-t cf-d">
  <title id="cf-t">Flash is not always a tonnage problem</title>
  <desc id="cf-d">Flash at one repeating spot points to parting face wear or ejector clearance, not tonnage. Flash around the whole perimeter sends you to the tonnage calculation. If the machine already exceeds the calculated requirement, and the flash drops when hold pressure drops, the cause is overpacking: advance the V slash P transfer and lower hold pressure rather than raising clamp force.</desc>

  <rect x="250" y="8" width="220" height="34" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="360" y="30" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Flash at the parting line</text>

  <line x1="360" y1="42" x2="360" y2="62" stroke="var(--faint)" stroke-width="1.5"/>
  <rect x="238" y="62" width="244" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="83" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Whole perimeter?</text>

  <line x1="238" y1="78" x2="121" y2="78" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="121" y1="78" x2="121" y2="176" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="180" y="71" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no, one spot</text>

  <line x1="360" y1="94" x2="360" y2="118" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="378" y="110" font-size="10.5" font-weight="600" fill="var(--faint)">yes</text>

  <rect x="228" y="118" width="264" height="32" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <text x="360" y="139" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Machine below the calculation?</text>

  <line x1="360" y1="150" x2="360" y2="176" stroke="var(--warn)" stroke-width="1.8"/>
  <text x="376" y="167" font-size="10.5" font-weight="600" fill="var(--warn)">yes</text>

  <line x1="492" y1="134" x2="599" y2="134" stroke="var(--ok)" stroke-width="2"/>
  <line x1="599" y1="134" x2="599" y2="176" stroke="var(--ok)" stroke-width="2"/>
  <text x="545" y="127" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--ok)">no, it clears it</text>

  <rect x="14" y="176" width="214" height="60" rx="6" fill="var(--faint)" opacity=".12"/>
  <text x="121" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">Mold, not machine</text>
  <text x="121" y="213" font-size="10.5" text-anchor="middle" fill="var(--faint)">parting face wear, debris,</text>
  <text x="121" y="229" font-size="10.5" text-anchor="middle" fill="var(--faint)">ejector pin clearance</text>

  <rect x="246" y="176" width="228" height="60" rx="6" fill="var(--warn)" opacity=".12"/>
  <text x="360" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="var(--warn)">Tonnage</text>
  <text x="360" y="213" font-size="10.5" text-anchor="middle" fill="var(--faint)">the press is undersized</text>
  <text x="360" y="229" font-size="10.5" text-anchor="middle" fill="var(--faint)">for this projected area</text>

  <rect x="492" y="176" width="214" height="60" rx="6" fill="var(--ok)" opacity=".14"/>
  <text x="599" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ok)">Overpacking</text>
  <text x="599" y="213" font-size="10.5" text-anchor="middle" fill="var(--faint)">advance V/P transfer,</text>
  <text x="599" y="229" font-size="10.5" text-anchor="middle" fill="var(--faint)">lower hold pressure</text>
</svg>
