<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tws-t tws-d">
  <title id="tws-t">Weld line: the lever depends on whether the resin is glass-filled</title>
  <desc id="tws-d">Unfilled resin responds to melt temperature. Glass-filled resin responds to packing pressure. In both cases a line that looks better is not necessarily stronger.</desc>

  <rect x="6" y="2" width="168" height="24" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="90" y="18" font-size="12.5" font-weight="600" text-anchor="middle" fill="var(--ink)">Weld line</text>

  <path d="M90 26 v5 M46 31 h88 M46 31 v5 M134 31 v5" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>

  <rect x="6" y="36" width="80" height="38" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="46" y="52" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--faint)">no glass</text>
  <text x="46" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">melt temp</text>

  <rect x="94" y="36" width="80" height="38" rx="7" fill="none" stroke="var(--faint)" stroke-width="1.2" opacity=".55"/>
  <text x="134" y="52" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--faint)">glass-filled</text>
  <text x="134" y="66" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">packing P</text>

  <path d="M46 74 v5 M46 79 h88 M134 74 v5 M90 79 v5" fill="none" stroke="var(--danger)" stroke-width="1.2" opacity=".7"/>

  <rect x="6" y="84" width="168" height="46" rx="7" fill="var(--danger)" opacity=".08"/>
  <rect x="6" y="84" width="168" height="46" rx="7" fill="none" stroke="var(--danger)" stroke-width="1.3"/>
  <text x="90" y="104" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--danger)">looks better ≠ stronger</text>
  <text x="90" y="120" font-size="9" text-anchor="middle" fill="var(--faint)">conditions narrow the gap, not close it</text>
</svg>
