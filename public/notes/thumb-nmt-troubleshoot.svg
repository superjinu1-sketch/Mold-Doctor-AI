<svg viewBox="0 0 180 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tnt-t tnt-d">
  <title id="tnt-t">Whose fault is the failed bond</title>
  <desc id="tnt-d">A failed metal-resin bond splits two ways. Resin left on the metal means the press can fix it by raising mold temperature. Bare clean metal means the treated insert failed upstream and must go back.</desc>

  <text x="90" y="17" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink)">Read the fracture face</text>

  <!-- press-fixable -->
  <rect x="12" y="26" width="76" height="60" rx="5" fill="var(--ok)" opacity=".1"/>
  <rect x="12" y="26" width="76" height="60" rx="5" fill="none" stroke="var(--ok)" stroke-width="1"/>
  <text x="50" y="41" font-size="8" font-weight="700" text-anchor="middle" fill="var(--ok)">resin on metal</text>
  <rect x="24" y="48" width="52" height="9" rx="1" fill="var(--brand-tint)"/>
  <rect x="24" y="57" width="52" height="12" fill="var(--muted)" opacity=".3"/>
  <g fill="var(--brand)"><rect x="30" y="55" width="4" height="8"/><rect x="46" y="55" width="4" height="8"/><rect x="62" y="55" width="4" height="8"/></g>
  <text x="50" y="80" font-size="7.5" text-anchor="middle" fill="var(--muted)">press fixes it</text>

  <!-- upstream -->
  <rect x="92" y="26" width="76" height="60" rx="5" fill="var(--warn)" opacity=".1"/>
  <rect x="92" y="26" width="76" height="60" rx="5" fill="none" stroke="var(--warn)" stroke-width="1"/>
  <text x="130" y="41" font-size="8" font-weight="700" text-anchor="middle" fill="var(--warn)">bare metal</text>
  <rect x="104" y="48" width="52" height="9" rx="1" fill="var(--brand-tint)"/>
  <rect x="104" y="59" width="52" height="10" fill="var(--muted)" opacity=".3"/>
  <text x="130" y="80" font-size="7.5" text-anchor="middle" fill="var(--muted)">back in the box</text>

  <rect x="14" y="110" width="152" height="20" rx="5" fill="var(--ok)" opacity=".1"/>
  <text x="90" y="124" font-size="8.5" font-weight="700" text-anchor="middle" fill="var(--ok)">mold too cold is the usual fault</text>
</svg>
