<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wl-t wl-d">
  <title id="wl-t">How a weld line knits, unfilled resin versus glass-filled</title>
  <desc id="wl-d">In unfilled resin, polymer chains diffuse across the plane where two flow fronts meet, so melt temperature raises weld strength. In glass-filled resin the fibers arrive lying parallel to that plane and none cross it, leaving a resin-only interface, so packing pressure is the setting that moves strength.</desc>

  <text x="20" y="22" font-size="13" font-weight="700" fill="var(--ink)">Unfilled</text>
  <text x="20" y="40" font-size="11" fill="var(--faint)">chains diffuse across the joint</text>

  <rect x="20" y="58" width="300" height="112" fill="var(--faint)" opacity=".07"/>
  <line x1="20" y1="58" x2="160" y2="58" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="180" y1="58" x2="320" y2="58" stroke="var(--faint)" stroke-width="1.5"/>
  <path d="M160 58 L170 67 L180 58" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="170" y1="67" x2="170" y2="170" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>

  <g stroke="var(--faint)" stroke-width="1.3" opacity=".5">
    <line x1="42" y1="88" x2="116" y2="88"/>
    <line x1="298" y1="88" x2="224" y2="88"/>
  </g>
  <path d="M120 88 l-7 -4 v8 z" fill="var(--faint)" opacity=".5"/>
  <path d="M220 88 l7 -4 v8 z" fill="var(--faint)" opacity=".5"/>

  <g stroke="var(--ok)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M136 114 q17 -9 34 0 q17 9 34 0"/>
    <path d="M136 134 q17 9 34 0 q17 -9 34 0"/>
    <path d="M142 154 q14 -8 28 0 q14 8 28 0"/>
  </g>
  <text x="212" y="138" font-size="10.5" font-weight="600" fill="var(--ok)">chains cross</text>

  <text x="20" y="197" font-size="12" font-weight="600" fill="var(--ok)">→ melt temperature raises weld strength</text>
  <text x="20" y="215" font-size="11" fill="var(--faint)">more heat, more diffusion across the plane</text>

  <text x="400" y="22" font-size="13" font-weight="700" fill="var(--ink)">Glass-filled</text>
  <text x="400" y="40" font-size="11" fill="var(--faint)">fibers lie parallel to the joint</text>

  <rect x="400" y="58" width="300" height="112" fill="var(--faint)" opacity=".07"/>
  <line x1="400" y1="58" x2="540" y2="58" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="560" y1="58" x2="700" y2="58" stroke="var(--faint)" stroke-width="1.5"/>
  <path d="M540 58 L550 67 L560 58" fill="none" stroke="var(--faint)" stroke-width="1.5"/>
  <line x1="550" y1="67" x2="550" y2="170" stroke="var(--danger)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <g stroke="var(--faint)" stroke-width="1.3" opacity=".5">
    <line x1="422" y1="88" x2="496" y2="88"/>
    <line x1="678" y1="88" x2="604" y2="88"/>
  </g>
  <path d="M500 88 l-7 -4 v8 z" fill="var(--faint)" opacity=".5"/>
  <path d="M600 88 l7 -4 v8 z" fill="var(--faint)" opacity=".5"/>

  <g stroke="var(--faint)" stroke-width="2.2" stroke-linecap="round" opacity=".4">
    <line x1="414" y1="110" x2="446" y2="112"/>
    <line x1="422" y1="140" x2="454" y2="138"/>
    <line x1="654" y1="112" x2="686" y2="110"/>
    <line x1="646" y1="140" x2="678" y2="142"/>
  </g>

  <g stroke="var(--danger)" stroke-width="2.2" stroke-linecap="round" opacity=".85">
    <line x1="524" y1="100" x2="526" y2="126"/>
    <line x1="536" y1="114" x2="538" y2="142"/>
    <line x1="512" y1="124" x2="514" y2="152"/>
    <line x1="541" y1="94" x2="542" y2="118"/>
    <line x1="574" y1="102" x2="572" y2="128"/>
    <line x1="562" y1="116" x2="560" y2="144"/>
    <line x1="586" y1="124" x2="584" y2="152"/>
    <line x1="559" y1="94" x2="558" y2="116"/>
  </g>
  <text x="600" y="140" font-size="10.5" font-weight="600" fill="var(--danger)">none cross</text>

  <text x="400" y="197" font-size="12" font-weight="600" fill="var(--ok)">→ packing pressure raises weld strength</text>
  <text x="400" y="215" font-size="11" fill="var(--faint)">heat improves the look, not what it carries</text>
</svg>
