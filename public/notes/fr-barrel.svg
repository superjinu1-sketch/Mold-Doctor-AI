<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frb-t frb-d">
  <title id="frb-t">Where flame-retardant PPA corrodes the machine</title>
  <desc id="frb-d">A cutaway of the barrel and screw. Dried resin enters at the feed throat, the heater bands hold the melt at temperature, and the screw carries it to the non-return valve and out through the nozzle. The acid formed from the flame retardant attacks the metal it sits on: the screw flight surfaces show pitting and an orange-peel texture, the non-return check ring wears and starts to leak so cushion and shot size drift, and the nozzle corrodes at the tip.</desc>

  <text x="360" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">Where flame-retardant PPA corrodes the machine</text>

  <!-- feed throat / hopper -->
  <path d="M96 104 L112 60 L168 60 L152 104 Z" fill="var(--faint)" opacity=".14"/>
  <path d="M96 104 L112 60 L168 60 L152 104" fill="none" stroke="var(--faint)" stroke-width="1.3"/>
  <text x="132" y="52" font-size="9.5" font-weight="600" text-anchor="middle" fill="var(--faint)">dried resin in</text>

  <!-- heater bands -->
  <rect x="196" y="92" width="54" height="9" rx="2" fill="var(--warn)" opacity=".5"/>
  <rect x="300" y="92" width="54" height="9" rx="2" fill="var(--warn)" opacity=".5"/>
  <rect x="404" y="92" width="54" height="9" rx="2" fill="var(--warn)" opacity=".5"/>
  <text x="510" y="99" font-size="9" font-weight="600" fill="var(--warn)">heaters</text>

  <!-- barrel -->
  <rect x="60" y="102" width="486" height="62" rx="10" fill="var(--surface)" stroke="var(--muted)" stroke-width="2.5"/>

  <!-- screw rod -->
  <rect x="72" y="128" width="474" height="8" fill="var(--muted)" opacity=".5"/>
  <!-- upper flights -->
  <path d="M78 128 L94 110 L110 128 L126 110 L142 128 L158 110 L174 128 L190 110 L206 128 L222 110 L238 128 L254 110 L270 128 L286 110 L302 128 L318 110 L334 128 L350 110 L366 128 L382 110 L398 128 L414 110 L430 128 L446 110 L462 128 L478 110 L494 128 L510 110 L526 128" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
  <!-- lower flights -->
  <path d="M78 136 L94 154 L110 136 L126 154 L142 136 L158 154 L174 136 L190 154 L206 136 L222 154 L238 136 L254 154 L270 136 L286 154 L302 136 L318 154 L334 136 L350 154 L366 136 L382 154 L398 136 L414 154 L430 136 L446 154 L462 136 L478 154 L494 136 L510 154 L526 136" fill="none" stroke="var(--muted)" stroke-width="1.6"/>

  <!-- non-return check ring -->
  <rect x="528" y="118" width="16" height="28" rx="2" fill="var(--muted)" opacity=".55" stroke="var(--muted)" stroke-width="1.2"/>

  <!-- nozzle -->
  <path d="M546 116 L588 133 L546 150 Z" fill="var(--muted)" opacity=".5" stroke="var(--muted)" stroke-width="1.2"/>
  <rect x="586" y="130" width="14" height="6" rx="1" fill="var(--muted)" opacity=".6"/>

  <!-- corrosion hotspots -->
  <circle cx="286" cy="110" r="5.5" fill="var(--danger)"/>
  <circle cx="536" cy="120" r="5.5" fill="var(--danger)"/>
  <circle cx="590" cy="133" r="5" fill="var(--danger)"/>

  <!-- callout: flights -->
  <line x1="286" y1="110" x2="286" y2="78" stroke="var(--danger)" stroke-width="1.2"/>
  <text x="286" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--danger)">screw flights</text>
  <text x="286" y="211" font-size="0" fill="none"> </text>

  <!-- callout: check ring -->
  <line x1="536" y1="146" x2="536" y2="190" stroke="var(--danger)" stroke-width="1.2"/>
  <text x="536" y="204" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--danger)">check ring</text>
  <text x="536" y="218" font-size="9.5" text-anchor="middle" fill="var(--faint)">wears &amp; leaks</text>

  <!-- callout: nozzle -->
  <line x1="592" y1="133" x2="628" y2="133" stroke="var(--danger)" stroke-width="1.2"/>
  <text x="632" y="130" font-size="10.5" font-weight="700" fill="var(--danger)">nozzle</text>

  <!-- flights sub-label -->
  <text x="286" y="82" font-size="9.5" text-anchor="middle" fill="var(--faint)">pitting · orange-peel</text>

  <text x="360" y="240" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">The acid attacks the metal it sits on — the screw flights, the non-return valve, the nozzle.</text>
</svg>
